[project]
name = "compactionbench"
version = "0.0.1"
description = "Simple direct-injection benchmark for harness compaction on long-context tasks."
requires-python = ">=3.11"
authors = [{ name = "Ayush Nangia", email = "amaan.gokrani@gmail.com" }]
readme = "README.md"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyarrow>=24.0.0",
    "pyyaml>=6.0",
    "openrouter>=0.9.1",
    "python-dotenv>=1.2.2",
    "huggingface_hub>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
cbench = "compactionbench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["compactionbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
